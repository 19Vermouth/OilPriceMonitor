[project]
name = "geip"
version = "0.1.0"
description = "Global Energy Intelligence Platform"
readme = "Readme.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "GEIP Team" }]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "streamlit>=1.40.0",
    "plotly>=5.24.0",
    "redis>=5.2.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "deltalake>=0.20.0",
    "pyarrow>=18.0.0",
    "pandas>=2.0.0",
    "prometheus-fastapi-instrumentator>=6.1.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "alembic>=1.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_ignores = true
